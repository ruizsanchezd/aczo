# Publica el prototipo en Vercel.
#
# Por qué existe: el plan gratuito de Vercel solo acepta cambios firmados por la
# persona dueña de la cuenta. Como en el repo trabajamos varias personas, dejamos
# que sea GitHub quien llame a Vercel usando SIEMPRE la misma llave (VERCEL_TOKEN),
# así da igual quién haya escrito el cambio.
#
# - Cuando algo entra en "main"  -> se actualiza el enlace bueno del prototipo.
# - Cuando se abre una propuesta -> se crea un enlace de prueba para revisarla.

name: Publicar en Vercel

on:
  push:
    branches: [main]
  pull_request:

# Si llegan dos cambios seguidos, se publica solo el último.
concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_QOG9XIGpToX2MnWibTR0KvFV
  VERCEL_PROJECT_ID: prj_aptCPxXOd8fwgOBOX7Oo9MiJRdLx

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar la herramienta de Vercel
        run: npm install --global vercel@latest

      - name: Preparar el proyecto
        run: vercel pull --yes --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Construir el prototipo
        run: vercel build ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Publicar
        id: publicar
        run: |
          URL=$(vercel deploy --prebuilt ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### 🔗 Prototipo publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
